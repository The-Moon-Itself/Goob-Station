
- type: entity
  parent: [BaseItem, BaseGunWieldable]
  id: BlastCannon
  name: pipe gun
  description: A pipe welded onto a gun stock, with a mechanical trigger. The pipe has an opening near the top, and there seems to be a spring loaded wheel in the hole.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Cannons/blast_cannon.rsi
    layers:
    - state: icon
      map: [ "enum.BlastCannonVisualsLayers.icon" ]
    - state: transfer-valve
      map: [ "enum.BlastCannonVisualsLayers.ttv" ]
      visible: false
  - type: Item
    size: Large
  - type: Gun
    minAngle: 40
    maxAngle: 60
    fireRate: 1
    soundGunshot:
      path: /Audio/_Goobstation/Weapons/Guns/Gunshots/blastcannon.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: GunWieldBonus
    minAngle: -40
    maxAngle: -60
  - type: Wieldable
  - type: GunRecoil
    negatedIfWielded: true
    refreshKnockdown: false
  - type: ContainerAmmoProvider
    container: TransferValveSlot
  - type: BlastCannon
    transferValveSlot:
        whitelist:
          components:
            - TransferValve


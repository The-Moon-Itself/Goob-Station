

- type: entity
  id: PortablePump
  parent: [BaseMachinePowered, SmallConstructibleMachine, StructureWheeled]
  name: portable pump
  description: It pumps, portably!
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: AtmosDevice
    joinSystem: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 100
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _Goobstation/Structures/Piping/Atmospherics/Portable/portable_pump.rsi
    noRot: true
    layers:
    - state: icon
    - state: fan-idle
      map: ["enum.PortablePumpVisualLayers.IsRunning"]
    - state: not-full
      visible: false
      map: ["enum.PortablePumpVisualLayers.IsFull"]
    - state: connected
      visible: false
      map: ["enum.PortablePumpVisualLayers.IsConnected"]
    - state: tank
      visible: false
      map: ["enum.PortablePumpVisualLayers.HasTank"]
  - type: PortablePump
    gasMixture:
      volume: 750
    gasTankSlot:
      ejectOnBreak: true
      whitelist:
        components:
          - GasTank
  - type: NodeContainer
    nodes:
      port:
        !type:PortablePipeNode
        nodeGroupID: Pipe
        rotationsEnabled: false
        volume: 1
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: Appearance
  - type: PortablePumpVisuals
    idleState: fan-idle
    runningState: fan-running
  - type: Machine
    board: PortablePumpMachineCircuitBoard
  - type: UserInterface
    interfaces:
      enum.PortablePumpUiKey.Key:
        type: PortablePumpBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: false
    key: enum.PortablePumpUiKey.Key
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:SpawnEntitiesBehavior
            spawn:
              SheetSteel1:
                min: 1
                max: 3
              SheetGlass1:
                min: 1
                max: 2
          - !type:DoActsBehavior
            acts: [ "Destruction" ]

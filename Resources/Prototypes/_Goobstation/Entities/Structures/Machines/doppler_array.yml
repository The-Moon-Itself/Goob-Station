- type: entity
  parent: [BaseMachinePowered, ConstructibleMachine]
  id: ResearchDopplerArray
  name: tachyon-doppler research array
  description: A highly precise directional sensor array which measures the release of quants from decaying tachyons. The doppler shifting of the mirror-image formed by these quants can reveal the size, location and temporal affects of energetic disturbances within a large radius ahead of the array.
  components:
  - type: DopplerArray
    researchEnabled: true
    profitEnabled: true
  - type: UserInterface
    interfaces:
      enum.DopplerArrayUIKey.Key:
        type: DopplerArrayBoundUserInterface
  - type: ActivatableUIRequiresPower
  - type: Speech
    speechVerb: Robotic
  - type: ResearchClient
  - type: ActivatableUI
    key: enum.DopplerArrayUIKey.Key
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/doppler_array.rsi
    noRot: true
    layers:
    - state: icon
    - state: dish
    - state: screenOn
      shader: unshaded
      visible: false
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: dishGlow
      shader: unshaded
      visible: false
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: {visible: true}
          False: {visible: false}
  - type: Appearance
  - type: Physics
    bodyType: Static
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
